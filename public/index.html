<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterviewReady — Your Daily MBA Prep</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#F5F3EE;--surface:#FFF;--text:#1C1917;--text2:#78716C;--accent:#6D28D9;--accent-s:#EDE9FE;--accent-m:#A78BFA;--border:#E7E5E4;--green:#059669;--green-s:#D1FAE5;--amber:#D97706;--amber-s:#FEF3C7;--red:#DC2626;--red-s:#FEE2E2;--blue:#2563EB;--blue-s:#DBEAFE;--r:16px;--rs:10px}
    [data-theme="dark"]{--bg:#1C1917;--surface:#292524;--text:#FAFAF9;--text2:#A8A29E;--border:#44403C;--accent-s:#2E1065;--green-s:#052E16;--red-s:#450A0A;--amber-s:#451A03;--blue-s:#172554}
    [data-theme="dark"] .header{background:rgba(28,25,23,.9)}[data-theme="dark"] .radar-svg text{fill:var(--text)!important}
    .theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
    .header{background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100}.header-inner{max-width:620px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--accent);cursor:pointer}.header-right{display:flex;align-items:center;gap:8px}.date-badge,.streak-badge,.concept-badge{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px}.date-badge{color:var(--text2);background:var(--bg);border:1px solid var(--border)}.streak-badge{color:var(--amber);background:var(--amber-s)}.concept-badge{color:var(--accent);background:var(--accent-s)}.user-btn{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}.auth-btn{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-s);border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
    .nav{max-width:620px;margin:0 auto;padding:12px 16px 0;display:flex;gap:4px;overflow-x:auto}.nav-tab{font-size:13px;font-weight:500;color:var(--text2);background:none;border:none;padding:8px 14px;border-radius:var(--rs);cursor:pointer;font-family:inherit;white-space:nowrap}.nav-tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .main{max-width:620px;margin:0 auto;padding:16px 16px 40px}.page{display:none}.page.active{display:block}
    .hero{margin-bottom:20px}.hero h1{font-family:'DM Serif Display',serif;font-size:30px;line-height:1.2;margin-bottom:4px}.hero p{font-size:14px;color:var(--text2)}
    .progress-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:18px}.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.progress-top span{font-size:13px;font-weight:600}.progress-top small{font-size:12px;color:var(--text2)}.progress-track{width:100%;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-m));border-radius:3px;transition:width .5s;width:0%}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}.card-hd{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.card-lbl{display:flex;align-items:center;gap:12px;flex:1}.card-ico{width:40px;height:40px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.card-t{font-weight:600;font-size:15px}.card-st{font-size:12px;color:var(--text2);margin-top:1px}.card-chv{color:var(--text2);transition:transform .3s;font-size:14px}.card.open .card-chv{transform:rotate(180deg)}.card-bd{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.22,1,.36,1)}.card.open .card-bd{max-height:5000px}.card-in{padding:0 20px 20px;border-top:1px solid var(--border)}
    .card-news .card-ico{background:var(--blue-s)}.card-hr .card-ico{background:var(--red-s)}.card-guess .card-ico{background:var(--green-s)}.card-gd .card-ico{background:var(--amber-s)}.card-company .card-ico{background:var(--accent-s)}
    .hl{font-family:'DM Serif Display',serif;font-size:21px;line-height:1.3;margin:14px 0 8px}.bt{font-size:14px;line-height:1.75;color:#44403C;margin:8px 0}.lb{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:18px 0 6px}.hb{background:var(--accent-s);border-left:3px solid var(--accent);padding:14px 16px;border-radius:0 var(--rs) var(--rs) 0;font-size:14px;line-height:1.7;margin:8px 0}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.si{background:var(--bg);padding:12px 14px;border-radius:var(--rs)}.sl{font-weight:700;font-size:13px;color:var(--accent)}.stx{font-size:13px;color:var(--text2)}
    .diff{display:inline-block;font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;margin-top:14px}.diff-easy{background:var(--green-s);color:var(--green)}.diff-mid{background:var(--amber-s);color:var(--amber)}.diff-tough{background:var(--red-s);color:var(--red)}
    .steps{list-style:none;margin:10px 0;counter-reset:step}.steps li{counter-increment:step;padding:10px 0 10px 36px;position:relative;font-size:14px;border-bottom:1px solid var(--border)}.steps li:last-child{border-bottom:none}.steps li::before{content:counter(step);position:absolute;left:0;top:11px;width:24px;height:24px;background:var(--accent-s);color:var(--accent);font-size:12px;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .pr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.pr h4{font-size:13px;font-weight:600;margin-bottom:8px}.pr ul{list-style:none;font-size:13px}.pr ul li{padding:5px 0 5px 20px;position:relative}.pf li::before{content:"✓";position:absolute;left:0;top:5px;color:var(--green);font-weight:700}.pa li::before{content:"✗";position:absolute;left:0;top:5px;color:var(--red);font-weight:700}
    .tb{background:var(--amber-s);border:1px solid #FDE68A;padding:12px 16px;border-radius:var(--rs);font-size:13px;color:#92400E}
    .mc{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.mch{background:var(--bg);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-size:12px;color:var(--text2)}
    .sp-btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:14px}.sp-c{max-height:0;overflow:hidden;transition:max-height .4s}.sp-c.show{max-height:600px}
    .mk-d{display:flex;align-items:center;gap:6px;margin-top:16px;padding:8px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);font-size:12px;font-weight:500;font-family:inherit;color:var(--text2);cursor:pointer}.mk-d:hover,.mk-d.done{border-color:var(--green);color:var(--green);background:var(--green-s)}
    .use-box{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--rs);padding:12px 16px;margin-top:14px;font-size:13px;line-height:1.7}.use-box .use-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--green);margin-bottom:6px}.use-tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;margin-right:4px}.use-tag-gd{background:#DBEAFE;color:#1E40AF}.use-tag-int{background:#E9D5FF;color:#6B21A8}.use-tag-case{background:#FEF3C7;color:#92400E}
    .concept-chip{background:#CCFBF1;border:1px solid #99F6E4;color:#0F766E;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;display:inline-block}.concept-chip:hover{background:#99F6E4}
    .cotd{background:linear-gradient(135deg,#CCFBF1,#E0F2FE);border:1px solid #99F6E4;border-radius:var(--r);padding:24px;margin-bottom:12px}.cotd h3{font-family:'DM Serif Display',serif;font-size:22px;color:#0F766E}.cotd .cotd-example{background:rgba(255,255,255,.7);padding:12px 16px;border-radius:var(--rs);font-size:13px;margin:10px 0}.cotd .cotd-use{background:rgba(255,255,255,.5);border-left:3px solid #0F766E;padding:10px 14px;border-radius:0 var(--rs) var(--rs) 0;font-size:13px;font-style:italic;margin:10px 0}.cotd .related{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.cotd .related span{background:rgba(255,255,255,.6);padding:3px 10px;border-radius:20px;font-size:12px;color:#0F766E}
    .news-item{border:1px solid var(--border);border-radius:var(--rs);padding:16px;margin:10px 0;background:var(--bg)}.news-item h3{font-family:'DM Serif Display',serif;font-size:17px;margin-bottom:6px}
    .news-cat{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;margin-bottom:8px;text-transform:uppercase}.cat-Economy{background:#DBEAFE;color:#1E40AF}.cat-Technology{background:#CCFBF1;color:#0F766E}.cat-FMCG{background:#FCE7F3;color:#BE185D}.cat-Banking{background:#FEF3C7;color:#92400E}.cat-Startups{background:#D1FAE5;color:#065F46}.cat-Marketing{background:#FDF2F8;color:#BE185D}.cat-Global{background:#F1F5F9;color:#475569}.cat-System{background:#F5F5F5;color:#737373}
    .news-toggle{font-size:12px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:inherit;font-weight:500;margin-top:6px}.news-detail{display:none;margin-top:10px}.news-detail.show{display:block}
    .quiz-q{background:var(--bg);border-radius:var(--rs);padding:16px;margin:10px 0}.quiz-q p{font-size:14px;font-weight:600;margin-bottom:10px}.quiz-opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;font-family:inherit;cursor:pointer}.quiz-opt:hover{border-color:var(--accent)}.quiz-opt.correct{border-color:var(--green);background:var(--green-s)}.quiz-opt.wrong{border-color:var(--red);background:var(--red-s)}.quiz-exp{font-size:13px;color:var(--text2);margin-top:8px;padding:8px 12px;background:var(--surface);border-radius:6px;display:none}.quiz-exp.show{display:block}.quiz-score{text-align:center;padding:20px;font-size:16px;font-weight:600;color:var(--accent)}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.modal{background:var(--surface);border-radius:var(--r);padding:32px 28px;width:100%;max-width:400px}.modal h2{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:6px}.modal p{font-size:14px;color:var(--text2);margin-bottom:20px}.modal label{font-size:13px;font-weight:500;display:block;margin-bottom:4px;margin-top:12px}.modal input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;outline:none}.modal .btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:16px}.modal .switch{font-size:13px;color:var(--text2);text-align:center;margin-top:14px}.modal .switch a{color:var(--accent);cursor:pointer;font-weight:500}.modal .err{font-size:13px;color:var(--red);margin-top:8px;display:none}
    .pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:14px}.pcard h3{font-size:16px;font-weight:600;margin-bottom:12px}.pcard label{font-size:13px;font-weight:500;display:block;margin-bottom:4px;margin-top:12px;color:var(--text2)}.pcard textarea,.pcard input[type=text]{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;resize:vertical;outline:none}.pcard textarea{min-height:100px}.save-btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:16px}.saved-msg{font-size:13px;color:var(--green);margin-left:10px;display:none}
    .scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:10px}.scard h4{font-size:15px;font-weight:600}.stags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.stag{font-size:11px;background:var(--accent-s);color:var(--accent);padding:2px 8px;border-radius:4px}.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}.sgrid div{background:var(--bg);padding:8px 10px;border-radius:6px}.sgrid strong{color:var(--accent);font-size:12px}.sdel{font-size:12px;color:var(--red);cursor:pointer;background:none;border:none;font-family:inherit;margin-top:8px}.add-btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:16px}
    .no-login{text-align:center;padding:60px 20px;color:var(--text2);font-size:14px}
    .radar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px;text-align:center}.radar-svg{max-width:380px;margin:0 auto}.overall-score{font-family:'DM Serif Display',serif;font-size:48px;color:var(--accent)}.overall-label{font-size:14px;color:var(--text2);margin-bottom:16px}.readiness-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600}
    .dim-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:10px}.dim-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dim-name{font-weight:600;font-size:14px}.dim-score{font-weight:700;font-size:16px;color:var(--accent)}.dim-bar{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:6px}.dim-fill{height:100%;border-radius:4px}.dim-range{width:100%;accent-color:var(--accent)}.dim-tip{font-size:12px;color:var(--text2)}
    /* GROWTH AREAS */
    .ga-section{margin-bottom:20px}.ga-section h3{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:4px}.ga-sub{font-size:13px;color:var(--text2);margin-bottom:14px}
    .ga-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;transition:border-color .2s}.ga-card:hover{border-color:var(--accent-m)}
    .ga-count{min-width:44px;height:44px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
    .ga-count-hot{background:var(--red-s);color:var(--red)}.ga-count-warm{background:var(--amber-s);color:var(--amber)}.ga-count-cool{background:var(--accent-s);color:var(--accent)}
    .ga-info{flex:1;min-width:0}.ga-area{font-size:14px;font-weight:600;line-height:1.4}.ga-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
    .ga-dim{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--text2)}
    .ga-when{font-size:11px;color:var(--text2)}
    .ga-empty{text-align:center;padding:32px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text2);font-size:14px}.ga-empty-icon{font-size:32px;margin-bottom:8px}
    .ga-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
    .ga-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px;text-align:center}.ga-stat-num{font-family:'DM Serif Display',serif;font-size:24px;color:var(--accent)}.ga-stat-label{font-size:11px;color:var(--text2);margin-top:2px}
    .ga-apply{font-size:12px;color:var(--accent);cursor:pointer;background:var(--accent-s);border:1px solid transparent;padding:5px 12px;border-radius:20px;font-family:inherit;font-weight:600;margin-top:12px}.ga-apply:hover{border-color:var(--accent)}
    .ga-reset{font-size:12px;color:var(--text2);cursor:pointer;background:none;border:none;font-family:inherit;margin-top:12px;margin-left:8px}.ga-reset:hover{color:var(--red)}
    /* COACH */
    .coach-container{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:400px}
    .coach-modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.mode-btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;color:var(--text2)}.mode-btn:hover,.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .chat-messages{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:85%;padding:14px 18px;border-radius:var(--r);font-size:14px;line-height:1.7;animation:fadeUp .3s ease-out}
    .msg-coach{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}.msg-user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
    .msg-coach .msg-label{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
    .msg-score{background:var(--accent-s);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:12px;font-weight:600;color:var(--accent)}

    .chat-input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;font-family:inherit;outline:none;resize:none;min-height:48px;max-height:120px}.chat-input:focus{border-color:var(--accent)}
    .chat-send{background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.chat-send:hover{background:#5B21B6}.chat-send:disabled{background:var(--border);cursor:not-allowed}
    /* Voice */
    .mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:var(--surface);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
    .mic-btn:hover{border-color:var(--red)}.mic-btn.recording{background:var(--red);border-color:var(--red);animation:pulse 1.5s infinite}
    .speech-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

    .stat-good{border-color:var(--green);color:var(--green);background:var(--green-s)}
    .stat-warn{border-color:var(--amber);color:var(--amber);background:var(--amber-s)}
    .stat-bad{border-color:var(--red);color:var(--red);background:var(--red-s)}
    .filler-highlight{background:var(--red-s);color:var(--red);padding:0 4px;border-radius:3px;font-weight:600}
    .voice-toggle{display:flex;gap:4px;margin-bottom:8px;align-items:center}
    .voice-toggle label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;cursor:pointer}
    .voice-toggle input{accent-color:var(--accent)}
    .coach-welcome{text-align:center;padding:40px 20px}.coach-welcome h2{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:8px}.coach-welcome p{color:var(--text2);font-size:14px;margin-bottom:20px}
    .loading{text-align:center;padding:80px 20px}.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
    .footer{text-align:center;padding:24px 20px;font-size:13px;color:var(--text2)}.footer a{color:var(--accent);text-decoration:none}
    /* MARKETING MAP */
    .mm-cat{margin-bottom:16px}
    .mm-cat-header{font-size:16px;font-weight:700;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

// ═══ VOICE COACH ═══
function initSpeechRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){console.log('Speech recognition not supported');return}
  recognition=new SR();
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang='en-IN';
  recognition.onresult=function(e){
    var transcript='';
    for(var i=0;i<e.results.length;i++){transcript+=e.results[i][0].transcript}
    var input=document.getElementById('chatInput');
    if(input)input.value=transcript;
  };
  recognition.onerror=function(e){console.log('Speech error:',e.error);stopRecording()};
  recognition.onend=function(){if(isRecording)stopRecording()};
}

function toggleRecording(){
  if(isRecording){stopRecording()}
  else{startRecording()}
}

function startRecording(){
  if(!recognition)initSpeechRecognition();
  if(!recognition){toast('Voice input needs Chrome or Edge','error');return}
  var input=document.getElementById('chatInput');
  if(input)input.value='';
  isRecording=true;
  recordStart=Date.now();
  var mic=document.getElementById('micBtn');
  if(mic)mic.classList.add('recording');
  try{recognition.start()}catch(e){}
}

function stopRecording(){
  isRecording=false;
  var mic=document.getElementById('micBtn');
  if(mic)mic.classList.remove('recording');
  try{recognition.stop()}catch(e){}
  var input=document.getElementById('chatInput');
  if(input&&input.value.trim()){
    var text=input.value.trim();
    var duration=(Date.now()-recordStart)/1000;
    var stats=analyzeSpeech(text,duration);
    showSpeechStats(stats);
  }
}

var HEDGES=['i think maybe','sort of','kind of','i guess','i feel like','probably maybe','not sure but','i suppose','might be','it seems like','just','perhaps'];
function analyzeSpeech(text,durationSec){
  var words=text.split(/\s+/).filter(function(w){return w.length>0});
  var wordCount=words.length;
  var wpm=durationSec>0?Math.round(wordCount/(durationSec/60)):0;
  var lower=text.toLowerCase();
  var fillerCount=0;
  var fillersFound=[];
  var fillersUsed=[];
  FILLERS.forEach(function(f){
    var regex=new RegExp('\\b'+f+'\\b','gi');
    var matches=lower.match(regex);
    if(matches){fillerCount+=matches.length;fillersFound.push({word:f,count:matches.length});fillersUsed.push(f)}
  });
  var hedgeCount=0;
  HEDGES.forEach(function(h){
    var regex=new RegExp('\\b'+h+'\\b','gi');
    var matches=lower.match(regex);
    if(matches)hedgeCount+=matches.length;
  });
  var fillerRate=wordCount>0?Math.round(fillerCount/wordCount*100):0;
  return{wordCount:wordCount,wpm:wpm,duration:Math.round(durationSec),fillerCount:fillerCount,fillerRate:fillerRate,fillersFound:fillersFound,fillersUsed:fillersUsed,hedgeCount:hedgeCount};
}

function highlightFillers(text){
  var result=text;
  FILLERS.forEach(function(f){
    var regex=new RegExp('(\\b'+f+'\\b)','gi');
    result=result.replace(regex,'<span class="filler-highlight">$1</span>');
  });
  return result;
}

function showSpeechStats(stats){
  var el=document.getElementById('speechStats');
  if(!el)return;
  var wpmClass=stats.wpm>=120&&stats.wpm<=160?'stat-good':stats.wpm>160?'stat-warn':'stat-bad';
  var fillerClass=stats.fillerRate<=3?'stat-good':stats.fillerRate<=8?'stat-warn':'stat-bad';
  var hedgeClass=stats.hedgeCount===0?'stat-good':stats.hedgeCount<=2?'stat-warn':'stat-bad';
  el.innerHTML='<div class="speech-stats">'+
    '<span class="stat-chip '+wpmClass+'">🗣️ '+stats.wpm+' WPM</span>'+
    '<span class="stat-chip">⏱️ '+stats.duration+'s</span>'+
    '<span class="stat-chip">📝 '+stats.wordCount+' words</span>'+
    '<span class="stat-chip '+fillerClass+'">'+(stats.fillerCount>0?'⚠️ '+stats.fillerCount+' filler'+(stats.fillerCount>1?'s':''):'✅ No fillers')+'</span>'+
    '<span class="stat-chip '+hedgeClass+'">'+(stats.hedgeCount>0?'😬 '+stats.hedgeCount+' hedge'+(stats.hedgeCount>1?'s':''):'💪 No hedging')+'</span>'+
    (stats.fillersFound.length>0?stats.fillersFound.map(function(f){return'<span class="stat-chip stat-bad">\"'+f.word+'\" ×'+f.count+'</span>'}).join(''):'')+'</div>';
}

function speakText(text){
  if(!speakEnabled)return;
  var clean=text.replace(/📊.*$/m,'').replace(/\*\*/g,'').replace(/\n/g,'. ').substring(0,500);
  var utter=new SpeechSynthesisUtterance(clean);
  utter.lang='en-IN';
  utter.rate=0.95;
  utter.pitch=1;
  var voices=speechSynthesis.getVoices();
  var enVoice=voices.find(function(v){return v.lang.indexOf('en')===0&&v.name.indexOf('Female')>=0})||voices.find(function(v){return v.lang.indexOf('en')===0});
  if(enVoice)utter.voice=enVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function msgBubble(m){
  if(m.role==='user'){
    var uidx=coachHistory.indexOf(m);
    var content=m.speechStats?highlightFillers(escHtml(m.content)):escHtml(m.content);
    var saveMyBtn=currentUser&&m.content.length>20?'<div style="margin-top:4px;text-align:right"><button class="bm-btn" onclick="saveMyAnswer('+Math.max(0,uidx)+')">🔖 Save My Answer</button></div>':'';
    var html='<div class="msg msg-user">'+content+saveMyBtn+'</div>';
    if(m.speechStats){
      var s=m.speechStats;
      var wc=s.wpm>=120&&s.wpm<=160?'stat-good':s.wpm>160?'stat-warn':'stat-bad';
      var fc=s.fillerRate<=3?'stat-good':s.fillerRate<=8?'stat-warn':'stat-bad';
      html+='<div class="speech-stats" style="align-self:flex-end"><span class="stat-chip '+wc+'">'+s.wpm+' WPM</span><span class="stat-chip">'+s.duration+'s</span><span class="stat-chip '+fc+'">'+(s.fillerCount>0?s.fillerCount+' filler'+(s.fillerCount>1?'s':''):'✅ Clean')+'</span></div>';
    }
    return html;
  }
  var idx=coachHistory.length-1;
  var hasScore=m.content.indexOf('📊')>=0;
  var tryAgainBtn=hasScore?'<button class="bm-btn" onclick="tryAgain()" style="background:var(--amber-s);border-color:var(--amber);color:var(--amber)">🔄 Try Again</button> ':'';
  var saveBtn=currentUser&&m.content.length>50?'<button class="bm-btn" onclick="saveCoachNote('+Math.max(0,idx)+')">🔖 Save as Note</button>':'';
  var buttons=(tryAgainBtn||saveBtn)?'<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">'+tryAgainBtn+saveBtn+'</div>':'';
  return'<div class="msg msg-coach"><div class="msg-label">Coach</div>'+formatCoach(m.content)+buttons+'</div>';
}

function formatCoach(t){t=escHtml(t);t=t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');t=t.replace(/(📊.*?)(\n|$)/g,'<div class="msg-score">$1</div>');t=t.replace(/(❌ WEAK:.*?)(<br>|$)/g,'<div style="background:var(--red-s);color:var(--red);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px">$1</div>');t=t.replace(/(✅ BETTER:.*?)(<br>|$)/g,'<div style="background:var(--green-s);color:#065F46;padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px">$1</div>');t=t.replace(/(💬 MEMORIZE:.*?)(<br>|$)/g,'<div style="background:var(--accent-s);color:var(--accent);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px;font-weight:600">$1</div>');t=t.replace(/(Priya|Arjun|Meera)(\s*(?:says|cuts in|nods|adds|argues|responds|interrupts|counters)[^:]*:)/gi,'<strong style="color:var(--blue)">$1</strong>$2');t=t.replace(/\n/g,'<br>');return t}
function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function sendMsg(){
  if(coachBusy)return;
  var input=document.getElementById('chatInput');
  var text=input.value.trim();
  if(!text)return;

  // Check for speech stats
  var statsEl=document.getElementById('speechStats');
  var speechData=null;
  if(statsEl&&statsEl.innerHTML){
    var duration=(Date.now()-recordStart)/1000;
    speechData=analyzeSpeech(text,duration>300?30:duration);
  }

  input.value='';
  if(statsEl)statsEl.innerHTML='';

  var msgObj={role:'user',content:text};
  if(speechData){
    msgObj.speechStats=speechData;
    // Save to server for trends
    fetch('/api/speech-stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wpm:speechData.wpm,fillerCount:speechData.fillerCount,fillersUsed:speechData.fillersUsed||[],duration:speechData.duration,wordCount:speechData.wordCount,hedges:speechData.hedgeCount||0,practiceType:coachMode})}).catch(function(){});
  }
  coachHistory.push(msgObj);

  var msgs=document.getElementById('chatMessages');
  msgs.innerHTML+=msgBubble(msgObj);
  msgs.innerHTML+='<div class="msg-typing" id="typingIndicator">Coach is thinking...</div>';
  scrollChat();
  sendToCoach(text);
}

function sendToCoach(text){
  coachBusy=true;
  var btn=document.getElementById('chatSend');
  if(btn)btn.disabled=true;
  fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:coachHistory.filter(function(m){return!m.speechStats||m.role!=='user'}).map(function(m){return{role:m.role,content:m.content}}),practiceType:coachMode})}).then(function(r){return r.json()}).then(function(j){
    var typing=document.getElementById('typingIndicator');if(typing)typing.remove();
    var reply=j.reply||'Coach unavailable. Try again.';
    coachHistory.push({role:'assistant',content:reply});
    var msgs=document.getElementById('chatMessages');
    if(msgs)msgs.innerHTML+=msgBubble({role:'assistant',content:reply});
    scrollChat();
    speakText(reply);
    if(j.scores){
      toast('Scores saved to dashboard','success');
      // Auto-save struggled questions (score < 7 on any dimension)
      var avgScore=0,count=0;
      if(j.scores.type==='gd'){avgScore=(j.scores.content+j.scores.structure+j.scores.listening+j.scores.composure+j.scores.initiative)/5;count=5}
      else{avgScore=((j.scores.relevance||0)+(j.scores.structure||0)+(j.scores.specificity||0)+(j.scores.marketing||0))/4;count=4}
      if(avgScore<7&&coachHistory.length>=2){
        var lastUserMsg=null;for(var hi=coachHistory.length-1;hi>=0;hi--){if(coachHistory[hi].role==='user'){lastUserMsg=coachHistory[hi];break}}
        var lastCoachQ=null;for(var hi=coachHistory.length-2;hi>=0;hi--){if(coachHistory[hi].role==='assistant'){lastCoachQ=coachHistory[hi];break}}
        if(lastCoachQ&&lastUserMsg){
          var qMatch=lastCoachQ.content.match(/\*\*(.+?)\*\*/)||lastCoachQ.content.match(/^(.{20,100}[?.])/m);
          var questionText=qMatch?qMatch[1]:lastCoachQ.content.substring(0,150);
          fetch('/api/struggled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:questionText,score:Math.round(avgScore),answer:lastUserMsg.content.substring(0,300),feedback:reply.substring(0,300)})}).catch(function(){});
        }
      }
    }
    coachBusy=false;if(btn)btn.disabled=false;
  }).catch(function(){
    var typing=document.getElementById('typingIndicator');if(typing)typing.remove();
    coachHistory.push({role:'assistant',content:'Connection error — try again.'});
    var msgs=document.getElementById('chatMessages');if(msgs)msgs.innerHTML+=msgBubble({role:'assistant',content:'Connection error — try again.'});
    toast('Could not reach coach','error');
    coachBusy=false;if(btn)btn.disabled=false;
  });
}

var dims=[{key:'currentAffairs',name:'Current Affairs',icon:'📰',tip:'Read daily news'},{key:'structuredThinking',name:'Structured Thinking',icon:'🧮',tip:'Practice cases'},{key:'communication',name:'Communication',icon:'🗣️',tip:'Reduce fillers'},{key:'personalNarrative',name:'Personal Story',icon:'📝',tip:'Build STAR stories'},{key:'domainKnowledge',name:'Marketing Domain',icon:'📚',tip:'Learn concepts'},{key:'gdReadiness',name:'GD Readiness',icon:'💬',tip:'Argue both sides'},{key:'pressureHandling',name:'Pressure',icon:'🎯',tip:'Timed mocks'}];

function renderDashboard(){
  var pg=document.getElementById('page-dashboard');

function buildDashboardUI(pg,sessionCount){
  var sc=radarMode==='auto'&&autoRadarScores?autoRadarScores:getRS();
  dims.forEach(function(d){if(!sc[d.key])sc[d.key]=30});
  var vals=dims.map(function(d){return sc[d.key]});
  var avg=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length);
  var tag=avg>=80?'Interview Ready':avg>=60?'Getting There':avg>=40?'Building Up':'Just Starting';
  var tc=avg>=80?'var(--green)':avg>=60?'var(--blue)':avg>=40?'var(--amber)':'var(--red)';
  var tb=avg>=80?'var(--green-s)':avg>=60?'var(--blue-s)':avg>=40?'var(--amber-s)':'var(--red-s)';

  var modeToggle='<div class="radar-mode">'+
    '<button class="radar-mode-btn '+(radarMode==='auto'?'active':'')+'" onclick="setRadarMode(\'auto\')">Auto</button>'+
    '<button class="radar-mode-btn '+(radarMode==='manual'?'active':'')+'" onclick="setRadarMode(\'manual\')">Manual</button></div>';

  var autoNote=radarMode==='auto'?(autoRadarScores?'<div class="radar-auto-note">Based on '+sessionCount+' coach session'+(sessionCount!==1?'s':'')+'</div>':'<div class="radar-auto-note">No coach sessions yet — complete a few to see auto scores</div>'):'';

  pg.innerHTML='<div class="hero"><h1>Dashboard</h1><p>Track your readiness across 7 dimensions</p></div>'+
    '<div class="radar-wrap"><div class="overall-score">'+avg+'</div><div class="overall-label">Overall Readiness</div>'+
    '<span class="readiness-tag" style="color:'+tc+';background:'+tb+'">'+tag+'</span>'+
    modeToggle+autoNote+
    '<div style="margin-top:16px" id="radarChart"></div></div>'+
    '<div id="growthAreaSlot"><div class="loading"><div class="spinner"></div></div></div>'+
    '<div id="improvePlanSlot"></div>'+
    '<div id="coverageSlot"></div>'+
    '<div id="speechAnalyticsSlot"></div>'+
    '<div id="languagePlanSlot"></div>'+
    (radarMode==='manual'?dims.map(function(d){
      var val=sc[d.key];var bc=val>=70?'var(--green)':val>=40?'var(--amber)':'var(--red)';
      return'<div class="dim-card"><div class="dim-header"><span class="dim-name">'+d.icon+' '+d.name+'</span><span class="dim-score" id="score-'+d.key+'">'+val+'</span></div>'+
      '<div class="dim-bar"><div class="dim-fill" id="bar-'+d.key+'" style="width:'+val+'%;background:'+bc+'"></div></div>'+
      '<input type="range" class="dim-range" min="0" max="100" value="'+val+'" oninput="updateDim(\''+d.key+'\',this.value)">'+
      '<div class="dim-tip">'+d.tip+'</div></div>'
    }).join(''):dims.map(function(d){
      var val=sc[d.key];var bc=val>=70?'var(--green)':val>=40?'var(--amber)':'var(--red)';
      return'<div class="dim-card"><div class="dim-header"><span class="dim-name">'+d.icon+' '+d.name+'</span><span class="dim-score">'+val+'</span></div>'+
      '<div class="dim-bar"><div class="dim-fill" style="width:'+val+'%;background:'+bc+'"></div></div>'+
      '<div class="dim-tip">'+d.tip+'</div></div>'
    }).join(''))+
    exportBtnHTML();

  renderRadarSVG(sc);
  fetchGrowthAreas(function(data){var slot=document.getElementById('growthAreaSlot');if(slot)slot.innerHTML=renderGrowthHTML(data)});
  fetchImprovementPlan(function(data){var slot=document.getElementById('improvePlanSlot');if(slot)slot.innerHTML=renderImprovementHTML(data)});
  fetchSpeechAnalytics(function(data){var slot=document.getElementById('speechAnalyticsSlot');if(slot)slot.innerHTML=renderSpeechHTML(data)});
  fetchCoverage(function(data){var slot=document.getElementById('coverageSlot');if(slot)slot.innerHTML=renderCoverageHTML(data)});

function renderSpeechHTML(data){
  if(!data.hasData){
    return'<div class="speech-section"><h3>🎤 Speech Analytics</h3><p style="font-size:13px;color:var(--text2);margin-bottom:14px">Track your speaking patterns across sessions</p><div class="imp-empty"><div style="font-size:28px;margin-bottom:8px">🎙️</div>Use the mic button in Coach to speak your answers.<br>Your WPM, fillers, and hedging will be tracked here.</div></div>';
  }

  var scoreColor=data.speechScore>=70?'var(--green)':data.speechScore>=45?'var(--amber)':'var(--red)';
  var scoreBg=data.speechScore>=70?'var(--green-s)':data.speechScore>=45?'var(--amber-s)':'var(--red-s)';

  var html='<div class="speech-section"><h3>🎤 Speech Analytics</h3><p style="font-size:13px;color:var(--text2);margin-bottom:14px">Based on '+data.totalAnswers+' voice answer'+(data.totalAnswers!==1?'s':'')+'</p>';

  // Score ring
  html+='<div style="text-align:center"><div class="speech-score-ring" style="color:'+scoreColor+';border:4px solid '+scoreColor+';background:'+scoreBg+'">'+data.speechScore+'</div><div style="font-size:12px;color:var(--text2)">Speech Score</div></div>';

  // Stats grid
  var wpmColor=data.recentAvgWPM>=120&&data.recentAvgWPM<=160?'var(--green)':data.recentAvgWPM>160?'var(--red)':'var(--amber)';
  var fillerColor=data.recentAvgFillers<=1?'var(--green)':data.recentAvgFillers<=3?'var(--amber)':'var(--red)';
  html+='<div class="speech-stats-grid">'+
    '<div class="speech-stat"><div class="speech-stat-val" style="color:'+wpmColor+'">'+data.recentAvgWPM+'</div><div class="speech-stat-label">Avg WPM</div><div class="speech-stat-trend">'+(data.wpmImproving?'📈 Improving':'Target: 130-150')+'</div></div>'+
    '<div class="speech-stat"><div class="speech-stat-val" style="color:'+fillerColor+'">'+data.recentAvgFillers+'</div><div class="speech-stat-label">Avg Fillers</div><div class="speech-stat-trend">'+(data.improving?'📉 Decreasing':'Target: under 2')+'</div></div>'+
    '<div class="speech-stat"><div class="speech-stat-val" style="color:'+(data.recentAvgHedges<=1?'var(--green)':'var(--amber)')+'">'+data.recentAvgHedges+'</div><div class="speech-stat-label">Avg Hedges</div><div class="speech-stat-trend">Target: 0</div></div></div>';

  // Top fillers
  if(data.topFillers&&data.topFillers.length>0){
    html+='<div style="font-size:12px;font-weight:600;margin:12px 0 6px">Your top filler words:</div><div class="speech-fillers">'+
      data.topFillers.map(function(f){return'<span class="speech-filler-chip">"'+escHtml(f.word)+'" × '+f.count+'</span>'}).join('')+'</div>';
  }

  // Issues with tips
  if(data.issues&&data.issues.length>0){
    html+='<div style="font-size:12px;font-weight:600;margin:14px 0 8px">Areas to fix:</div>';
    data.issues.forEach(function(iss){
      html+='<div class="speech-issue"><div class="speech-issue-header"><span class="speech-issue-name">'+escHtml(iss.issue)+'</span><span class="speech-issue-sev speech-issue-sev-'+iss.severity+'">'+iss.severity+'</span></div>'+
        '<div class="speech-issue-detail">'+escHtml(iss.detail)+'</div>'+
        '<div class="speech-issue-tip">💡 '+escHtml(iss.tip)+'</div></div>';
    });
  } else {
    html+='<div style="text-align:center;padding:12px;font-size:13px;color:var(--green)">✨ Your speech patterns look solid. Keep practicing to maintain consistency.</div>';
  }

  html+='</div>';
  return html;
}

// ═══ COVERAGE TRACKER ═══
function fetchCoverage(cb){
  if(!currentUser){cb(null);return}
  Promise.all([safeFetch('/api/hr-bank'),safeFetch('/api/case-bank'),safeFetch('/api/iim-bank'),safeFetch('/api/coach-sessions'),safeFetch('/api/speech-analytics')]).then(function(results){
    cb({
      hr:{done:results[0].practicedCount,total:results[0].total},
      cases:{done:results[1].practicedCount,total:results[1].total},
      iim:{done:results[2].practicedCount,total:results[2].total},
      sessions:results[3].sessions?results[3].sessions.length:0,
      speech:results[4].hasData?results[4].totalAnswers:0
    });
  }).catch(function(){cb(null)});
}

function renderCoverageHTML(data){
  if(!data)return'';
  var totalQ=data.hr.total+data.cases.total+data.iim.total;
  var doneQ=data.hr.done+data.cases.done+data.iim.done;
  var pct=totalQ>0?Math.round(doneQ/totalQ*100):0;
  var readyLabel=pct>=70?'Strong coverage':pct>=40?'Keep going':pct>=15?'Building up':'Just started';
  var readyColor=pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)';

  // Readiness checklist
  var checks=[
    {label:'Profile & CV filled',done:currentUser&&currentUser.cv&&currentUser.cv.length>50,ico:'📄'},
    {label:'STAR stories added (3+)',done:false,ico:'📝',partial:false},
    {label:'HR questions practiced (20+)',done:data.hr.done>=20,partial:data.hr.done>=5,ico:'💬'},
    {label:'Case questions practiced (15+)',done:data.cases.done>=15,partial:data.cases.done>=5,ico:'🧮'},
    {label:'IIM-style practiced (10+)',done:data.iim.done>=10,partial:data.iim.done>=3,ico:'🏢'},
    {label:'Coach sessions done (10+)',done:data.sessions>=10,partial:data.sessions>=3,ico:'🎓'},
    {label:'Voice answers given (5+)',done:data.speech>=5,partial:data.speech>=1,ico:'🎤'},
    {label:'GD drills completed (3+)',done:data.sessions>=3,partial:data.sessions>=1,ico:'🗣️'}
  ];
  var checksDone=checks.filter(function(c){return c.done}).length;

  return'<div class="ready-check"><h3 style="font-family:DM Serif Display,serif;font-size:20px;margin-bottom:12px">✅ Readiness Checklist <span style="font-size:14px;color:var(--text2);font-family:DM Sans">'+checksDone+'/'+checks.length+'</span></h3>'+
    checks.map(function(c){
      var status=c.done?'done':c.partial?'partial':'todo';
      var statusText=c.done?'Done':c.partial?'In Progress':'To Do';
      return'<div class="ready-item"><span class="ready-ico">'+c.ico+'</span><span class="ready-label">'+c.label+'</span><span class="ready-status ready-'+status+'">'+statusText+'</span></div>';
    }).join('')+'</div>'+

    '<div style="margin-bottom:20px"><h3 style="font-family:DM Serif Display,serif;font-size:20px;margin-bottom:4px">📋 Question Coverage</h3>'+
    '<p style="font-size:13px;color:var(--text2);margin-bottom:14px">'+doneQ+'/'+totalQ+' questions practiced · <span style="color:'+readyColor+';font-weight:600">'+readyLabel+'</span></p>'+
    '<div class="cov-grid">'+
    covItem('HR',data.hr.done,data.hr.total,'hrbank')+
    covItem('Cases',data.cases.done,data.cases.total,'casebank')+
    covItem('IIM Style',data.iim.done,data.iim.total,'iimbank')+
    covItem('Coach Sessions',data.sessions,null,'coach')+
    covItem('Voice Answers',data.speech,null,null)+
    '</div></div>';
}

function covItem(label,done,total,page){
  var pct=total?Math.round(done/total*100):0;
  var val=total?done+'/'+total:done;
  return'<div class="cov-item"'+(page?' onclick="showPage(\''+page+'\')"':'')+'>'+
    '<div class="cov-item-val">'+val+'</div><div class="cov-item-label">'+label+'</div>'+
    (total?'<div class="cov-item-bar"><div class="cov-item-fill" style="width:'+pct+'%"></div></div>':'')+
    '</div>';
}

function renderLanguagePlanHTML(data){
  var recs=data.recommendations||[];

  var allAreas=Object.keys(res);

  var html='<div class="imp-section"><h3>🗣️ Communication Improvement Plan</h3>'+
    '<p style="font-size:13px;color:var(--text2);margin-bottom:14px">Personalized recommendations based on your speaking patterns — what to fix and exactly what to watch, read, or practice</p>';

  // Show detected issues first
  if(recs.length>0){
    html+='<div style="background:var(--amber-s);border:1px solid #FDE68A;border-radius:var(--r);padding:14px 18px;margin-bottom:14px">'+
      '<div style="font-size:13px;font-weight:600;color:#92400E;margin-bottom:8px">🔍 Detected from your practice sessions:</div>';
    recs.forEach(function(r){
      var priColor=r.priority==='high'?'var(--red)':'var(--amber)';
      html+='<div style="font-size:12px;margin:4px 0;padding-left:12px;border-left:3px solid '+priColor+'">'+
        '<strong style="color:'+priColor+'">'+res[r.area].icon+' '+res[r.area].title+'</strong> — '+escHtml(r.reason)+'</div>';
    });
    html+='</div>';
  }

  // Show all resource categories (prioritized ones first, then rest)
  var shown={};
  var orderedAreas=recs.map(function(r){return r.area}).concat(allAreas);
  orderedAreas.forEach(function(area){
    if(shown[area]||!res[area])return;shown[area]=true;
    var r=res[area];
    var isDetected=recs.some(function(rec){return rec.area===area});
    html+='<div class="imp-card" id="lang-'+area+'" onclick="document.getElementById(\'lang-'+area+'\').classList.toggle(\'expanded\')">'+
      '<div class="imp-card-header"><div><div class="imp-area">'+r.icon+' '+r.title+'</div>'+
      '<div class="imp-sub">Signs: '+escHtml(r.signs)+'</div></div>'+
      (isDetected?'<span class="imp-badge imp-badge-critical">Fix This</span>':'<span class="imp-badge imp-badge-foundational">Review</span>')+
      '</div>'+
      '<div class="imp-resources">'+
      r.resources.map(function(item){
        var typeClass='imp-res-type-'+item.type;
        if(item.type==='series'||item.type==='podcast'||item.type==='app'||item.type==='reference')typeClass='imp-res-type-read';
        return'<div class="imp-res"><span class="imp-res-type '+typeClass+'">'+item.type+'</span>'+
          '<span class="imp-res-title">'+escHtml(item.title)+'</span>'+
          (item.desc?'<div class="imp-res-desc" style="white-space:pre-wrap">'+escHtml(item.desc)+'</div>':'')+
          '</div>';
      }).join('')+
      '</div></div>';
  });
  html+='</div>';
  return html;
}

// ═══ GROWTH AREAS ═══
var cachedGrowthAreas=null;
function fetchGrowthAreas(cb){
  if(!currentUser){cb({areas:[],radarSuggestions:{}});return}
  fetch('/api/growth-areas').then(function(r){return r.json()}).then(function(j){cachedGrowthAreas=j;cb(j)}).catch(function(){cb({areas:[],radarSuggestions:{}})})
}

function renderGrowthHTML(data){
  var areas=data.areas||[];
  if(!areas.length){
    return'<div class="ga-section"><h3>Growth Areas</h3><p class="ga-sub">Patterns the coach notices across your practice sessions</p><div class="ga-empty"><div class="ga-empty-icon">🌱</div><div>No patterns detected yet.</div><div style="margin-top:4px">Complete a few coach sessions and your recurring areas for improvement will appear here.</div></div></div>';
  }
  var total=areas.reduce(function(s,a){return s+a.count},0);
  var topArea=areas[0];
  var cats={};areas.forEach(function(a){cats[a.category]=(cats[a.category]||0)+a.count});
  var weakestCat=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]})[0];
  var weakestName=dims.find(function(d){return d.key===weakestCat});

  var html='<div class="ga-section"><h3>Growth Areas</h3><p class="ga-sub">Patterns the coach notices — fix the top ones first</p>';

  // Summary stats
  html+='<div class="ga-summary"><div class="ga-stat"><div class="ga-stat-num">'+areas.length+'</div><div class="ga-stat-label">Patterns</div></div><div class="ga-stat"><div class="ga-stat-num">'+total+'</div><div class="ga-stat-label">Total notes</div></div><div class="ga-stat"><div class="ga-stat-num">'+(weakestName?weakestName.icon:'')+' </div><div class="ga-stat-label">'+(weakestName?weakestName.name:'—')+'</div></div></div>';

  // Individual areas
  for(var i=0;i<areas.length;i++){
    var a=areas[i];
    var countClass=a.count>=8?'ga-count-hot':a.count>=4?'ga-count-warm':'ga-count-cool';
    var dimObj=dims.find(function(d){return d.key===a.category});
    var dimName=dimObj?dimObj.name:a.category;
    var dimIcon=dimObj?dimObj.icon:'';
    var ago=daysSince(a.last_seen);
    html+='<div class="ga-card"><div class="ga-count '+countClass+'">'+a.count+'×</div><div class="ga-info"><div class="ga-area">'+escHtml(a.area)+'</div><div class="ga-meta"><span class="ga-dim">'+dimIcon+' '+dimName+'</span><span class="ga-when">'+(ago===0?'Today':ago===1?'Yesterday':ago+' days ago')+'</span></div></div></div>';
  }

  // Action buttons
  if(data.radarSuggestions&&Object.keys(data.radarSuggestions).length>0){
    html+='<button class="ga-apply" onclick="applyGrowthToRadar()">Apply to radar chart</button>';
  }
  html+='<button class="ga-reset" onclick="resetGrowthAreas()">Clear all</button>';
  html+='</div>';
  return html;
}

function daysSince(dateStr){
  if(!dateStr)return 999;
  var d=new Date(dateStr+'T00:00:00');
  var now=new Date();now.setHours(0,0,0,0);
  return Math.floor((now-d)/(1000*60*60*24));
}

function applyGrowthToRadar(){
  if(!cachedGrowthAreas||!cachedGrowthAreas.radarSuggestions)return;
  var s=getRS();
  var sug=cachedGrowthAreas.radarSuggestions;
  var changed=[];
  for(var k in sug){
    if(s[k]===undefined||s[k]>sug[k]){
      s[k]=sug[k];
      changed.push(k);
    }
  }
  if(changed.length>0){
    saveRS(s);
    renderDashboard();
  }
}

function resetGrowthAreas(){
  if(!confirm('Clear all growth area data? This cannot be undone.'))return;
  fetch('/api/growth-areas',{method:'DELETE'}).then(function(){cachedGrowthAreas=null;renderDashboard()});
}

function renderRadarSVG(sc){
  var vals=dims.map(function(d){return sc[d.key]||30});
  var cx=190,cy=190,r=150,n=7;
  var svg='<svg viewBox="0 0 380 380" class="radar-svg" xmlns="http://www.w3.org/2000/svg">';
  for(var ring=1;ring<=5;ring++){var rr=r*ring/5,pts='';for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;pts+=Math.round(cx+rr*Math.cos(a))+','+Math.round(cy+rr*Math.sin(a))+' '}svg+='<polygon points="'+pts+'" fill="none" stroke="#E7E5E4"/>'}
  for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2;svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+Math.round(cx+r*Math.cos(a))+'" y2="'+Math.round(cy+r*Math.sin(a))+'" stroke="#E7E5E4"/>'}
  var dp='';for(var i=0;i<n;i++){var a=Math.PI*2*i/n-Math.PI/2,v=vals[i]/100*r;dp+=Math.round(cx+v*Math.cos(a))+','+Math.round(cy+v*Math.sin(a))+' '}

  var c=cdConcepts[cdIndex];

    var col=r.score>=7?'var(--green)':r.score>=4?'var(--amber)':'var(--red)';

function scoreConceptAnswer(){
  var answer=document.getElementById('cdAnswer').value.trim();
  if(!answer||answer.length<10){toast('Write at least a few sentences','error');return}
  var c=cdConcepts[cdIndex];
  var slot=document.getElementById('cdScoreSlot');
  slot.innerHTML='<div class="loading"><div class="spinner"></div><div style="font-size:12px;color:var(--text2)">Scoring...</div></div>';
  fetch('/api/concept-drill-score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({term:c.term,full:c.full,answer:answer,correctDef:c.def})}).then(function(r){return r.json()}).then(function(j){
    if(!j.success){slot.innerHTML='<div style="color:var(--red);font-size:13px">Scoring failed — check API key</div>';return}
    var s=j.scores;
    var color=s.score>=7?'var(--green)':s.score>=4?'var(--amber)':'var(--red)';
    cdResults.push({term:c.term,score:s.score,ready:s.interview_ready});

function skipConcept(){
  cdResults.push({term:cdConcepts[cdIndex].term,score:0,ready:false,skipped:true});
  cdIndex++;showConceptCard();
}

function showConceptResults(slot){
  cdActive=false;
  var scored=cdResults.filter(function(r){return!r.skipped});
  var ready=cdResults.filter(function(r){return r.ready}).length;
  var avgScore=scored.length>0?Math.round(scored.reduce(function(s,r){return s+r.score},0)/scored.length*10)/10:0;
  var color=avgScore>=7?'var(--green)':avgScore>=4?'var(--amber)':'var(--red)';

  var html='<div style="text-align:center;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin:12px 0">'+
    '<div style="font-family:DM Serif Display,serif;font-size:42px;color:'+color+'">'+avgScore+'/10</div>'+
    '<div style="font-size:14px;color:var(--text2)">Average concept score</div>'+
    '<div style="font-size:13px;margin-top:8px">'+ready+'/'+cdResults.length+' concepts interview-ready</div></div>';

  cdResults.forEach(function(r){
    var col=r.skipped?'var(--text2)':r.score>=7?'var(--green)':r.score>=4?'var(--amber)':'var(--red)';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);margin:4px 0">'+
      '<span style="font-size:13px;font-weight:500">'+escHtml(r.term)+'</span>'+
      '<span style="font-size:12px;font-weight:700;color:'+col+'">'+(r.skipped?'Skipped':r.score+'/10'+(r.ready?' ✅':''))+'</span></div>';
  });

  html+='<div style="display:flex;gap:8px;margin-top:14px;justify-content:center">'+
    '<button class="sp-btn" onclick="startConceptDrill(\'all\')">🔀 Drill Again</button>'+
    '<button class="mode-btn" onclick="document.getElementById(\'conceptDrillSlot\').innerHTML=\'\'">Done</button></div>';
  slot.innerHTML=html;
}

function showGDStrategy(){
  var pg=document.getElementById('page-coach');
  pg.innerHTML='<button class="session-back" onclick="coachHistory=[];renderCoach()">← Back</button>'+
    '<div class="hero"><h1>🧠 GD Strategy Guide</h1><p>Everything you need to know before walking into a GD</p></div>'+

    // EVALUATION CRITERIA
    '<div class="gd-guide-card"><h4>📊 What Panelists Actually Score (weightage)</h4>'+
    '<div class="gd-guide-list">'+
    '<strong style="color:var(--red)">Content & Knowledge (25%)</strong> — Do you have substance? Data, examples, frameworks.<br>'+
    '<strong style="color:var(--red)">Analytical Ability (20%)</strong> — Can you break down the topic logically? Multiple perspectives?<br>'+
    '<strong style="color:var(--amber)">Communication Skills (20%)</strong> — Clarity, articulation, no fillers, appropriate pace.<br>'+
    '<strong style="color:var(--amber)">Leadership & Initiative (15%)</strong> — Did you initiate? Steer the discussion? Summarize?<br>'+
    '<strong style="color:var(--blue)">Listening & Team Play (10%)</strong> — Did you build on others? Acknowledge points?<br>'+
    '<strong style="color:var(--blue)">Body Language (10%)</strong> — Eye contact with group (not just panelists), posture, gestures.</div></div>'+

    // 5 OPENING TEMPLATES
    '<div class="gd-guide-card"><h4>🎬 5 Ways to Open a GD</h4>'+
    '<div class="gd-guide-list">'+
    '<strong>1. Data Hook</strong> — "A recent report shows that 73% of Indian consumers..." (establishes credibility)<br>'+
    '<strong>2. Question</strong> — "Before we dive in, let\'s ask: who does this really affect?" (frames the scope)<br>'+
    '<strong>3. Definition</strong> — "Let me start by defining what we mean by [topic]..." (useful for abstract topics)<br>'+
    '<strong>4. Contrarian</strong> — "While most would agree with X, I\'d argue the real question is Y..." (bold but risky)<br>'+
    '<strong>5. Framework</strong> — "I think we can analyze this from three perspectives: economic, social, and technological." (shows structure)<br><br>'+
    '<strong style="color:var(--green)">Best bet:</strong> Use #5 (Framework) if unsure. It\'s safe, shows structure, and others will follow your framing.</div></div>'+

    // CLOSING/SUMMARY TEMPLATE
    '<div class="gd-guide-card"><h4>📋 How to Summarize a GD (if asked)</h4>'+
    '<div class="gd-guide-list">'+
    '<strong>Template:</strong><br>'+
    '"We discussed [topic]. The group explored [X] key perspectives.<br>'+
    'On one hand, [Person A] and [Person B] argued that [main argument for]...<br>'+
    'On the other hand, [Person C] raised the point that [main argument against]...<br>'+
    'We found some consensus around [common ground, if any].<br>'+
    'The key question that remains unresolved is [open question]."<br><br>'+
    '<strong style="color:var(--green)">Pro tip:</strong> Name people by name ("As Priya mentioned..."). It shows you were listening AND helps the panelists identify who contributed.</div></div>'+

    // ROLES
    '<div class="gd-guide-card"><h4>🎭 Three Roles You Can Play</h4>'+
    '<div class="gd-role-grid">'+
    '<div class="gd-role"><div class="gd-role-ico">🚀</div><div class="gd-role-name">Initiator</div>Opens the discussion. High reward if done well, high risk if weak. Use only if you have strong content on the topic.</div>'+
    '<div class="gd-role"><div class="gd-role-ico">⚖️</div><div class="gd-role-name">Mediator</div>Connects different viewpoints. "Building on what Arjun said, and connecting it to Priya\'s point..." Safest role, always valued.</div>'+
    '<div class="gd-role"><div class="gd-role-ico">📋</div><div class="gd-role-name">Summarizer</div>Wraps up the discussion. Volunteer when moderator asks. Shows leadership and listening. Practice the template above.</div>'+
    '</div></div>'+

    // COMMON MISTAKES
    '<div class="gd-guide-card" style="border-color:var(--red)"><h4>🚨 Top 10 GD Mistakes</h4>'+
    '<div class="gd-guide-list">'+
    '<strong style="color:var(--red)">1. Speaking without substance</strong> — Don\'t talk just to be heard. One strong point > three weak ones.<br>'+
    '<strong style="color:var(--red)">2. Interrupting aggressively</strong> — Say "May I add to that?" not "No, you\'re wrong."<br>'+
    '<strong style="color:var(--red)">3. Monologuing</strong> — A GD is not a speech. Keep entries to 30-40 seconds max.<br>'+
    '<strong style="color:var(--red)">4. Only looking at panelists</strong> — Make eye contact with the GROUP. The panelists notice this.<br>'+
    '<strong style="color:var(--amber)">5. No framework</strong> — Don\'t ramble. State your point, give evidence, state impact.<br>'+
    '<strong style="color:var(--amber)">6. Ignoring others\' points</strong> — Always build on or acknowledge what was said before you.<br>'+
    '<strong style="color:var(--amber)">7. Getting personal</strong> — Attack the argument, never the person.<br>'+
    '<strong style="color:var(--amber)">8. Going blank and staying silent</strong> — Use the Anti-Blank frameworks (PESTEL, Stakeholder, Steel Man).<br>'+
    '<strong style="color:var(--blue)">9. Not knowing when to stop</strong> — If you\'ve made your point, stop. Silence is confident.<br>'+
    '<strong style="color:var(--blue)">10. Poor body language</strong> — Crossed arms, slouching, fidgeting. Sit upright, lean slightly forward, open gestures.</div></div>'+

    // ENTRY PHRASES
    '<div class="gd-guide-card"><h4>💬 Entry Phrases (memorize 3-4)</h4>'+
    '<div class="gd-guide-list">'+
    '<strong>To enter:</strong> "I\'d like to add a dimension to this..." / "Building on that point..." / "There\'s another perspective worth considering..."<br>'+
    '<strong>To counter:</strong> "That\'s a fair point, however..." / "I see it differently because..." / "While I agree with X, the data suggests..."<br>'+
    '<strong>To mediate:</strong> "Both sides have merit. Perhaps the real question is..." / "I think we\'re actually agreeing on the principle but differing on execution..."<br>'+
    '<strong>To summarize:</strong> "If I may, let me try to bring together what we\'ve discussed..." / "To synthesize the key points raised..."<br>'+
    '<strong style="color:var(--red)">NEVER say:</strong> "I disagree" / "You\'re wrong" / "That makes no sense" / "As I was saying before you interrupted me"</div></div>'+

    // CASE-BASED GD FORMAT
    '<div class="gd-guide-card"><h4>📊 Case-Based GD Format</h4>'+
    '<div class="gd-guide-list">'+
    'Some companies give a written case (1-2 pages) before the GD. You get 5-10 min to read.<br><br>'+
    '<strong>How to handle it:</strong><br>'+
    '1. Read the case TWICE — first for overview, second for data points<br>'+
    '2. Note 3 key numbers or facts — you\'ll use these as evidence<br>'+
    '3. Identify the core dilemma — there\'s always a trade-off<br>'+
    '4. Prepare your opening angle — which stakeholder\'s perspective will you take?<br>'+
    '5. In the GD, reference the data: "As the case mentions, revenue dropped 15%..."<br><br>'+
    '<strong style="color:var(--green)">People who cite data from the case always score higher.</strong></div></div>';
}

function toggleCLTimer(){
  if(clTimerInterval){stopCLTimer();return}
  clTimerSec=0;
  var ring=document.getElementById('clRing');
  var btn=document.getElementById('clStartBtn');
  ring.className='cl-timer-ring running';
  btn.textContent='Stop';btn.style.background='var(--red)';
  clTimerInterval=setInterval(function(){
    clTimerSec++;
    var m=Math.floor(clTimerSec/60);var s=clTimerSec%60;
    ring.textContent=m+':'+(s<10?'0':'')+s;
    if(clTimerSec===clTimerTarget){ring.className='cl-timer-ring done'}
    if(clTimerSec>clTimerTarget+10){ring.className='cl-timer-ring over'}
  },1000);
}

function stopCLTimer(){
  if(clTimerInterval){clearInterval(clTimerInterval);clTimerInterval=null}
  var ring=document.getElementById('clRing');
  var btn=document.getElementById('clStartBtn');
  if(btn){btn.textContent='Start Again';btn.style.background=''}
  if(ring&&clTimerSec>0){
    var diff=clTimerSec-clTimerTarget;
    var verdict=Math.abs(diff)<=5?'🎯 Perfect! Within 5 seconds of target.':diff<-10?'⚡ Too short by '+Math.abs(diff)+'s. Add more detail or examples.':diff>10?'🐌 Too long by '+diff+'s. Cut filler and be more concise.':'👍 Close! Off by '+Math.abs(diff)+'s.';
    var color=Math.abs(diff)<=5?'var(--green)':Math.abs(diff)<=15?'var(--amber)':'var(--red)';
    var res=document.getElementById('clTimedResult');
    if(res)res.innerHTML='<div style="text-align:center;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs)"><div style="font-size:20px;font-weight:700;color:'+color+'">'+clTimerSec+'s / '+clTimerTarget+'s</div><div style="font-size:14px;margin-top:6px">'+verdict+'</div></div>';
  }
}

    '<button class="ca-diff-btn medium '+(caDifficulty==='medium'?'active':'')+'" onclick="caDifficulty=\'medium\';showCAQuiz()">Medium<br><span style="font-size:10px;font-weight:400">Must-know</span></button>'+

    '</div>'+
    '<button class="hr-q-practice" onclick="generateCAQuiz()" style="margin-top:12px;width:100%;padding:12px">Generate Quiz (10 Questions)</button>'+
    '</div>'+
    '<button class="session-back" onclick="init();showPage(\'prep\')" style="margin-top:8px">← Back to Today</button>';

function generateCAQuiz(){
  var pg=document.getElementById('page-prep');
  pg.innerHTML='<div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--text2)">Generating '+caDifficulty+' '+caCategory+' quiz...</div></div>';
  fetch('/api/ca-quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:caCategory,difficulty:caDifficulty,count:10})}).then(function(r){return r.json()}).then(function(j){
    if(!j.success){toast(j.error||'Failed to generate','error');showCAQuiz();return}
    caQuizData=j.quiz;caAnswered={};caScore=0;
    renderCAQuiz(pg);
  }).catch(function(){toast('Connection error','error');showCAQuiz()});
}

function renderCAQuiz(pg){
  var qs=caQuizData;
  var total=qs.length;
  var answered=Object.keys(caAnswered).length;

  var html='<div class="hero"><h1>📰 Current Affairs Quiz</h1><p>'+caCategory.charAt(0).toUpperCase()+caCategory.slice(1)+' · '+caDifficulty+' · '+answered+'/'+total+' answered</p></div>';

  if(answered===total){
    var pct=Math.round(caScore/total*100);
    var color=pct>=70?'var(--green)':pct>=40?'var(--amber)':'var(--red)';
    var label=pct>=80?'Excellent!':pct>=60?'Good — keep reading':pct>=40?'Needs work':'Read more news daily';
    var weakTopics=[];
    qs.forEach(function(q,i){if(caAnswered[i]!==q.correct&&q.topic)weakTopics.push(q.topic)});

    html+='<div class="ca-result"><div class="ca-result-score" style="color:'+color+'">'+caScore+'/'+total+'</div><div class="ca-result-label">'+label+'</div>';
    if(weakTopics.length>0){
      html+='<div class="ca-result-weak"><div style="font-weight:600;margin-bottom:6px">Topics to read up on:</div>'+weakTopics.map(function(t){return'<span class="ca-q-topic" style="margin:2px">'+escHtml(t)+'</span>'}).join('')+'</div>';
    }
    html+='</div><div style="display:flex;gap:8px;margin:12px 0"><button class="hr-q-practice" onclick="showCAQuiz()">New Quiz</button><button class="reveal-btn" onclick="init();showPage(\'prep\')">← Back to Today</button></div>';

    // Save result
    fetch('/api/ca-quiz-result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:caCategory,score:caScore,total:total,weakTopics:weakTopics})}).catch(function(){});
  }

  qs.forEach(function(q,i){
    var isAnswered=caAnswered[i]!==undefined;
    html+='<div class="ca-q-card"><div class="ca-q-num">Q'+(i+1)+' of '+total+(q.topic?' · <span class="ca-q-topic">'+escHtml(q.topic)+'</span>':'')+'</div>'+
      '<div class="ca-q-text">'+escHtml(q.q)+'</div>'+
      q.options.map(function(opt,oi){
        var cls='ca-q-opt';
        if(isAnswered){
          cls+=' disabled';
          if(oi===q.correct)cls+=' correct';
          else if(oi===caAnswered[i]&&oi!==q.correct)cls+=' wrong';
        }
        return'<button class="'+cls+'" onclick="answerCA('+i+','+oi+')">'+escHtml(opt)+'</button>';
      }).join('')+
      '<div class="ca-q-explain'+(isAnswered?' show':'')+'">'+
      (isAnswered?'<div>'+escHtml(q.explanation)+'</div>'+
      (q.interviewUse?'<div class="ca-q-interview">💬 In an interview: "'+escHtml(q.interviewUse)+'"</div>':''):'')+'</div></div>';
  });

  pg.innerHTML=html;
}

function answerCA(qi,oi){
  if(caAnswered[qi]!==undefined)return;
  caAnswered[qi]=oi;
  var q=caQuizData[qi];
  if(oi===q.correct){caScore++}
  else if(currentUser){
    // Auto-bookmark wrong answers for review
    bookmarkItem('wrong-answer',q.q,q.explanation+(q.interviewUse?' | Interview: '+q.interviewUse:''),q.topic||'');
  }
  renderCAQuiz(document.getElementById('page-prep'));
}

    }).join('');
}
