// ═══ NEVER GO BLANK DRILL ═══
var ngbTimer=null,ngbSeconds=0,ngbLimit=15,ngbQuestions=[],ngbCurrent=0,ngbResults=[],ngbActive=false;
var NGB_POOL=[
  // HR — the ones that freeze people
  {q:"Tell me about yourself.",cat:"HR",rescue:"Framework: Background (1 line) → Why MBA (1 line) → Why Marketing (1 line) → Career goal (1 line). Say: 'I come from [background], pursued MBA because [reason], and I'm targeting [goal].'"},
  {q:"Why should we hire you?",cat:"HR",rescue:"Formula: Your unique strength + proof + what you'll bring. Say: 'My combination of [X background] and [Y skill] means I can [specific value]. For example, at [place], I [achievement].'"},
  {q:"What is your biggest weakness?",cat:"HR",rescue:"Pick a real one + show the fix. Say: 'I tend to [weakness]. I've been working on it by [specific action]. For instance, recently I [example of improvement].'"},
  {q:"Where do you see yourself in 5 years?",cat:"HR",rescue:"Role + impact + growth. Say: 'In 5 years I see myself as [role] at [type of company], leading [what kind of work], having built expertise in [domain].'"},
  {q:"Tell me about a time you failed.",cat:"HR",rescue:"STAR it: Situation → what went wrong → what you learned → how you applied it. Say: 'At [place], I [tried X]. It didn't work because [reason]. I learned [lesson] and since then I [changed behavior].'"},
  {q:"Why MBA? Why now?",cat:"HR",rescue:"Gap + bridge + goal. Say: 'In my career I realized I lacked [skill/perspective]. MBA bridges that gap. Specifically, I want to build [capability] to move into [target role].'"},
  {q:"Describe a conflict with a teammate.",cat:"HR",rescue:"Show empathy, not victory. Say: 'We disagreed about [topic]. I first listened to understand their perspective, then suggested [compromise]. The result was [outcome].'"},
  {q:"What motivates you?",cat:"HR",rescue:"Be specific, not generic. Not 'learning' — say 'figuring out why consumers choose one brand over another' or 'turning a vague brief into a campaign that moves numbers.'"},
  // Marketing knowledge
  {q:"What is STP? Give an example.",cat:"Marketing",rescue:"Segmentation → Targeting → Positioning. Example: 'Dove segments by psychographics (women who value real beauty), targets 25-45 women, positions as the brand that celebrates authentic beauty.'"},
  {q:"Explain the 4Ps with an Indian brand example.",cat:"Marketing",rescue:"Product, Price, Place, Promotion. Pick any brand: 'Maggi: Product (2-min noodles), Price (₹14 affordable), Place (every kirana store), Promotion (emotional family ads).'"},
  {q:"What's the difference between brand equity and brand awareness?",cat:"Marketing",rescue:"Awareness = do people know you exist. Equity = what's the brand WORTH beyond the product. Say: 'Parle-G has high awareness. Tata has high equity — people pay more just for the Tata name.'"},
  {q:"Name a marketing campaign you admire and why.",cat:"Marketing",rescue:"Structure: Campaign name → brand → what they did → consumer insight → why it worked. Have 2-3 campaigns ready. If blank, use: Amul topicals, Cadbury 'Kuch Meetha Ho Jaaye', Dove Real Beauty."},
  {q:"How would you increase sales of a declining product?",cat:"Marketing",rescue:"Framework: Diagnose (why declining?) → 4 levers: Product refresh, Price strategy, Distribution expansion, Communication relaunch. Pick 2 and go deep."},
  // Opinion / Current Affairs
  {q:"What's one business news story from this week?",cat:"Current Affairs",rescue:"If blank: fall back to a TREND you know. 'I've been following the quick commerce space — Zepto and Blinkers competing on 10-minute delivery, which raises questions about unit economics.'"},
  {q:"Is social media good or bad for society?",cat:"Opinion",rescue:"Never pick just one side. Framework: 'On one hand [benefit + example]. On the other hand [harm + example]. My view: [nuanced position]. The key is [specific point].'"},
  {q:"Should India focus on manufacturing or services?",cat:"Opinion",rescue:"Use the 'Both AND' structure: 'India needs both. Services drive GDP today, but manufacturing creates mass employment. The model should be [your position]. For example, [evidence].'"},
  {q:"What would you do with ₹1 crore?",cat:"Curveball",rescue:"Show thinking, not greed. Framework: 'I'd split it — [X%] into [investment/business], [Y%] into [growth/learning], and [Z%] for [personal/family]. My first move would be [specific].'"},
  // Curveball / Pressure
  {q:"Sell me this pen.",cat:"Curveball",rescue:"Don't list features. Ask a question first: 'Before I sell it, can I ask — when was the last time your pen failed you in an important moment?' Then: 'This pen ensures [benefit].'"},
  {q:"If you could be any brand, which would you be?",cat:"Curveball",rescue:"Pick a brand you admire + explain WHY using brand attributes. Say: 'I'd be [Brand] because [attribute 1] and [attribute 2] align with how I see myself — [connect to personal quality].'"},
  {q:"Rate yourself on a scale of 1-10.",cat:"Curveball",rescue:"Never say 10 (arrogant) or below 7 (no confidence). Say: 'I'd say 7.5 — I'm strong in [X] and [Y], but I'm still developing [Z]. The gap is what I'm working on every day.'"},
  {q:"What will you do if you don't get placed?",cat:"Pressure",rescue:"Show resilience, not desperation. Say: 'First, I'd analyze what went wrong. Then I'd [specific plan B — networking, off-campus, startup, freelance]. Placement isn't the only path to [career goal].'"},
  {q:"Your resume says [X] but you seem uncertain about it.",cat:"Pressure",rescue:"Don't backtrack. Say: 'I appreciate you pushing on that. Let me be more specific about what I did — [give concrete detail with a number]. The reason I'm confident is [evidence].'"},
  {q:"Convince me to visit your hometown.",cat:"Curveball",rescue:"Structure like a pitch: Hook (one striking fact) → 3 unique points (food, culture, place) → Close (personal invite). Say: 'My hometown is [place]. You should visit because [1], [2], and [3].'"},
  {q:"What makes you different from the 200 other MBAs sitting outside?",cat:"Pressure",rescue:"The intersection formula: 'Most candidates have either [A] or [B]. I have both — [A from background] combined with [B from MBA]. This means I can [unique value].'"},
  // Case mini-starters
  {q:"A brand's sales dropped 30% this quarter. What could be the reasons?",cat:"Case",rescue:"Use the funnel: 'I'd look at external (market, competition, economy) and internal (product, price, distribution, promotion). Starting with: has the category declined or just this brand?'"},
  {q:"Should Starbucks enter tier-2 cities in India?",cat:"Case",rescue:"Framework: Market attractiveness (demand, income levels) → Competitive landscape → Unit economics → Format adaptation. Say: 'Let me think about this in 3 parts — the demand side, the supply side, and the economics.'"},
  {q:"Estimate the number of haircuts in Mumbai per day.",cat:"Guesstimate",rescue:"Top-down: Population → segment (men/women/children) → frequency → daily. Say: 'Mumbai has ~2Cr people. Let me segment this...' Start with a number and work through it. Process > precision."},
];

function startNeverBlank(difficulty){
  var limits={easy:30,medium:15,hard:8};
  ngbLimit=limits[difficulty]||15;
  ngbResults=[];ngbCurrent=0;
  // Shuffle and pick 10 questions
  var pool=NGB_POOL.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  ngbQuestions=pool.slice(0,10);
  ngbActive=true;
  showNGBQuestion();
}

function showNGBQuestion(){
  var pg=document.getElementById('page-coach');
  if(ngbCurrent>=ngbQuestions.length){showNGBResults(pg);return}
  var q=ngbQuestions[ngbCurrent];
  var dotsHTML='<div class="ngb-streak">';
  for(var i=0;i<ngbQuestions.length;i++){
    if(i<ngbResults.length)dotsHTML+='<div class="ngb-dot '+(ngbResults[i].responded?'ngb-dot-ok':'ngb-dot-miss')+'">'+(ngbResults[i].responded?'✓':'✗')+'</div>';
    else if(i===ngbCurrent)dotsHTML+='<div class="ngb-dot" style="background:var(--accent-s);color:var(--accent);border:2px solid var(--accent)">'+(i+1)+'</div>';
    else dotsHTML+='<div class="ngb-dot ngb-dot-pending">'+(i+1)+'</div>';
  }
  dotsHTML+='</div>';

  pg.innerHTML='<div class="ngb-container">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
    '<div style="font-size:13px;font-weight:600">🧊 Never Go Blank — Q'+(ngbCurrent+1)+'/'+ngbQuestions.length+'</div>'+
    '<button class="mode-btn" onclick="ngbActive=false;clearInterval(ngbTimer);renderCoach()">✕ Exit</button></div>'+
    dotsHTML+
    '<div class="ngb-question"><div style="font-size:11px;font-weight:600;color:var(--accent)">'+escHtml(q.cat)+'</div>'+
    '<div class="ngb-q-text">'+escHtml(q.q)+'</div>'+
    '<div class="ngb-timer" id="ngbTimerDisplay">'+ngbLimit+'</div>'+
    '<div style="font-size:12px;color:var(--text2)">seconds to START responding</div></div>'+
    '<textarea class="ngb-input" id="ngbInput" placeholder="Type ANYTHING — wrong is fine, silence is not..." oninput="ngbInputChanged()"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
    '<button class="sp-btn" onclick="submitNGBAnswer()" id="ngbSubmitBtn" style="flex:1">Next Question →</button>'+
    '</div>'+
    '<div id="ngbRescueSlot"></div>'+
    '</div>';

  ngbSeconds=ngbLimit;
  document.getElementById('ngbTimerDisplay').textContent=ngbSeconds;
  document.getElementById('ngbInput').focus();
  clearInterval(ngbTimer);
  ngbTimer=setInterval(function(){
    ngbSeconds--;
    var display=document.getElementById('ngbTimerDisplay');
    if(!display){clearInterval(ngbTimer);return}
    display.textContent=Math.max(0,ngbSeconds);
    if(ngbSeconds<=3&&ngbSeconds>0)display.className='ngb-timer urgent';
    if(ngbSeconds<=0){
      clearInterval(ngbTimer);
      var input=document.getElementById('ngbInput');
      var answered=input&&input.value.trim().length>0;
      if(!answered){
        display.textContent='⏰';
        display.className='ngb-timer urgent';
        input.className='ngb-input timeout';
        showNGBRescue();
      }
    }
  },1000);
}

function ngbInputChanged(){
  var display=document.getElementById('ngbTimerDisplay');
  var input=document.getElementById('ngbInput');
  if(display&&input&&input.value.trim().length>0&&ngbSeconds>0){
    display.className='ngb-timer ok';
    display.textContent='✓';
    clearInterval(ngbTimer);
  }
}

function showNGBRescue(){
  var q=ngbQuestions[ngbCurrent];
  var slot=document.getElementById('ngbRescueSlot');
  if(!slot)return;
  slot.innerHTML='<div class="ngb-rescue"><div class="ngb-rescue-title">🛟 Anti-Freeze Rescue — here\'s what you could have said:</div>'+escHtml(q.rescue)+'</div>';
}

function submitNGBAnswer(){
  clearInterval(ngbTimer);
  var input=document.getElementById('ngbInput');
  var text=input?input.value.trim():'';
  ngbResults.push({question:ngbQuestions[ngbCurrent].q,answered:text,responded:text.length>0,timedOut:ngbSeconds<=0&&text.length===0});
  ngbCurrent++;
  showNGBQuestion();
}

function showNGBResults(pg){
  ngbActive=false;
  var responded=ngbResults.filter(function(r){return r.responded}).length;
  var total=ngbResults.length;
  var pct=Math.round(responded/total*100);
  var color=pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
  var verdict=pct===100?'Perfect — you responded to everything. Now work on QUALITY.':
    pct>=80?'Good reflex — a few blanks. Keep drilling until you hit 100%.':
    pct>=50?'Getting there — but '+Math.round(total-responded)+' blanks in a real interview means lost opportunities.':
    'This is exactly why we\'re doing this drill. Your brain freezes under pressure. Run this daily until you hit 10/10.';

  var html='<div class="ngb-container">'+
    '<div style="text-align:center;margin:20px 0"><div style="font-family:DM Serif Display,serif;font-size:48px;color:'+color+'">'+responded+'/'+total+'</div>'+
    '<div style="font-size:14px;color:var(--text2)">Questions you responded to</div>'+
    '<div style="font-size:13px;margin-top:8px;padding:10px 16px;background:'+(pct>=80?'var(--green-s)':'var(--red-s)')+';border-radius:var(--rs);display:inline-block">'+verdict+'</div></div>'+
    '<div class="ngb-stats">'+
    '<div class="ngb-stat"><div class="ngb-stat-num" style="color:var(--green)">'+responded+'</div><div class="ngb-stat-label">Responded</div></div>'+
    '<div class="ngb-stat"><div class="ngb-stat-num" style="color:var(--red)">'+(total-responded)+'</div><div class="ngb-stat-label">Went Blank</div></div>'+
    '<div class="ngb-stat"><div class="ngb-stat-num">'+ngbLimit+'s</div><div class="ngb-stat-label">Time Limit</div></div></div>';

  // Show each question result
  ngbResults.forEach(function(r,i){
    var q=ngbQuestions[i];
    html+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px 16px;margin-bottom:6px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font-size:14px;font-weight:500;flex:1">'+escHtml(r.question)+'</div>'+
      '<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;'+(r.responded?'background:var(--green-s);color:var(--green)':'background:var(--red-s);color:var(--red)')+'">'+(r.responded?'✓ Responded':'✗ Blank')+'</span></div>'+
      (r.responded?'<div style="font-size:12px;color:var(--text2);margin-top:6px;border-left:2px solid var(--green);padding-left:8px">'+escHtml(r.answered.substring(0,150))+(r.answered.length>150?'...':'')+'</div>':
      '<div class="ngb-rescue" style="margin-top:8px;margin-bottom:0"><div class="ngb-rescue-title">What you could have said:</div>'+escHtml(q.rescue)+'</div>')+
      '</div>';
  });

  html+='<div style="display:flex;gap:8px;margin-top:16px;justify-content:center">'+
    '<button class="sp-btn" style="background:var(--red)" onclick="startNeverBlank(ngbLimit<=8?\'hard\':ngbLimit<=15?\'medium\':\'easy\')">🔁 Run Again</button>'+
    '<button class="sp-btn" onclick="renderCoach()">← Back to Coach</button></div></div>';
  pg.innerHTML=html;
}

// ═══ ANSWER WORKSHOP ═══
var wsData=null,wsEditing=null,wsFilter='all';
function renderWorkshop(){
  var pg=document.getElementById('page-workshop');
  if(!currentUser){pg.innerHTML='<div class="no-login">Log in to use the Answer Workshop</div>';return}
  pg.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  safeFetch('/api/workshop-questions').then(function(j){
    wsData=j;renderWorkshopUI(pg,j);
  }).catch(function(){pg.innerHTML='<div class="no-login">Could not load. <a href="#" onclick="renderWorkshop()" style="color:var(--accent)">Retry</a></div>'});
}
function renderWorkshopUI(pg,data){
  var s=data.stats;
  var cats=data.categories;
  var filterBtns='<button class="mode-btn '+(wsFilter==='all'?'active':'')+'" onclick="wsFilter=\'all\';renderWorkshopUI(document.getElementById(\'page-workshop\'),wsData)">All ('+data.questions.length+')</button>';
  cats.forEach(function(c){
    var count=data.questions.filter(function(q){return q.cat===c}).length;
    filterBtns+='<button class="mode-btn '+(wsFilter===c?'active':'')+'" onclick="wsFilter=\''+c+'\';renderWorkshopUI(document.getElementById(\'page-workshop\'),wsData)">'+c+' ('+count+')</button>';
  });
  filterBtns+='<button class="mode-btn '+(wsFilter==='todo'?'active':'')+'" onclick="wsFilter=\'todo\';renderWorkshopUI(document.getElementById(\'page-workshop\'),wsData)" style="border-color:var(--red);color:var(--red)">Not Started</button>';
  filterBtns+='<button class="mode-btn '+(wsFilter==='locked'?'active':'')+'" onclick="wsFilter=\'locked\';renderWorkshopUI(document.getElementById(\'page-workshop\'),wsData)" style="border-color:var(--green);color:var(--green)">Locked ✓</button>';

  var html='<div class="hero"><h1>Answer Workshop</h1><p>Craft, refine, and lock your best answers for the 50 questions that decide every interview.</p></div>'+
    '<div class="ws-stats">'+
    '<div class="ws-stat"><div class="ws-stat-num" style="color:var(--red)">'+s.not_started+'</div><div class="ws-stat-label">Not Started</div></div>'+
    '<div class="ws-stat"><div class="ws-stat-num" style="color:var(--amber)">'+s.drafting+'</div><div class="ws-stat-label">Drafting</div></div>'+
    '<div class="ws-stat"><div class="ws-stat-num" style="color:var(--blue)">'+(s.refining||0)+'</div><div class="ws-stat-label">Refining</div></div>'+
    '<div class="ws-stat"><div class="ws-stat-num" style="color:var(--green)">'+s.locked+'</div><div class="ws-stat-label">Locked ✓</div></div></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">'+filterBtns+'</div>'+
    '<div id="wsEditorSlot"></div><div id="wsQuestionList">';

  var qs=data.questions;
  if(wsFilter!=='all'&&wsFilter!=='todo'&&wsFilter!=='locked')qs=qs.filter(function(q){return q.cat===wsFilter});
  if(wsFilter==='todo')qs=qs.filter(function(q){var a=data.answers[q.id];return !a||a.status==='not_started'});
  if(wsFilter==='locked')qs=qs.filter(function(q){var a=data.answers[q.id];return a&&a.status==='locked'});

  qs.forEach(function(q){
    var a=data.answers[q.id];
    var status=a?a.status:'not_started';
    var score=a?a.best_score:0;
    var pClass=q.priority===1?'ws-p1':q.priority===2?'ws-p2':'ws-p3';
    var pLabel=q.priority===1?'Must-Nail':q.priority===2?'Important':'Good to Have';
    html+='<div class="ws-q" onclick="openWorkshopEditor(\''+q.id+'\')">'+
      '<div class="ws-q-text">'+escHtml(q.q)+'</div>'+
      '<div class="ws-q-meta">'+
      '<span class="ws-q-status ws-'+status+'">'+(status==='not_started'?'Not Started':status==='drafting'?'Drafting':status==='refining'?'Refining 🔄':'Locked ✓')+'</span>'+
      '<span class="ws-priority '+pClass+'">'+pLabel+'</span>'+
      (score>0?'<span style="font-size:11px;font-weight:600;color:'+(score>=8?'var(--green)':score>=5?'var(--amber)':'var(--red)')+'">Best: '+score+'/10</span>':'')+
      '<span style="font-size:10px;color:var(--text2)">'+q.cat+'</span>'+
      '</div></div>';
  });
  html+='</div>';
  pg.innerHTML=html;
}

function openWorkshopEditor(qid){
  var q=wsData.questions.find(function(q){return q.id===qid});
  if(!q)return;
  var a=wsData.answers[qid];
  var draft=a?a.current_draft:'';
  var versions=a?JSON.parse(a.versions||'[]'):[];
  var locked=a&&a.status==='locked';
  wsEditing=qid;

  var html='<div class="ws-editor" id="wsEditor">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">'+
    '<div><div style="font-size:16px;font-weight:700">'+escHtml(q.q)+'</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-top:4px">💡 '+escHtml(q.why)+'</div></div>'+
    '<button class="mode-btn" onclick="wsEditing=null;renderWorkshopUI(document.getElementById(\'page-workshop\'),wsData)" style="flex-shrink:0">✕ Close</button></div>'+
    (locked?'<div style="padding:12px 16px;background:var(--green-s);border-radius:var(--rs);margin-bottom:12px;font-size:13px;color:var(--green);font-weight:600">✅ This answer is locked. You can still edit and re-lock it.</div>':'')+
    '<textarea class="ws-textarea" id="wsDraft" placeholder="Write your answer here... Aim for 4-6 sentences. Use specific examples, numbers, and STAR format for behavioral questions.">'+(locked&&a.locked_answer?escHtml(a.locked_answer):escHtml(draft))+'</textarea>'+
    '<div class="ws-actions">'+
    '<button class="sp-btn" onclick="scoreWorkshopAnswer(\''+qid+'\')">📊 Score My Answer</button>'+
    '<button class="sp-btn" style="background:var(--green)" onclick="saveWorkshopDraft(\''+qid+'\',false)">💾 Save Draft</button>'+
    '<button class="sp-btn" style="background:var(--amber)" onclick="saveWorkshopDraft(\''+qid+'\',true)">🔒 Lock This Answer</button>'+
    '<button class="mode-btn" onclick="practiceInCoach(\''+escHtml(q.q).replace(/'/g,"\\'")+'\')">🎓 Practice in Coach</button>'+
    '</div>'+
    '<div id="wsScoreResult"></div>';

  if(versions.length>0){
    html+='<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">📝 Version History ('+versions.length+')</div>';
    versions.slice().reverse().forEach(function(v,i){
      var sc=v.score||0;var color=sc>=8?'var(--green)':sc>=5?'var(--amber)':'var(--red)';
      var d=new Date(v.date);var dateStr=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      html+='<div class="ws-version" style="border-left-color:'+color+'"><span class="ws-version-score" style="color:'+color+'">v'+(versions.length-i)+' · '+sc+'/10</span><span style="font-size:11px;color:var(--text2)">'+dateStr+'</span>'+
        '<div style="margin-top:6px;font-size:12px;color:var(--text2);white-space:pre-wrap">'+escHtml((v.draft||'').substring(0,200))+(v.draft&&v.draft.length>200?'...':'')+'</div>'+
        (v.feedback?'<div style="margin-top:4px;font-size:11px;color:var(--accent)">'+escHtml(v.feedback.substring(0,150))+'</div>':'')+
        '</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  var slot=document.getElementById('wsEditorSlot');
  if(slot)slot.innerHTML=html;
  document.getElementById('wsEditor').scrollIntoView({behavior:'smooth',block:'start'});
}

function saveWorkshopDraft(qid,lock){
  var draft=document.getElementById('wsDraft').value.trim();
  if(!draft){toast('Write an answer first','error');return}
  fetch('/api/workshop-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionId:qid,draft:draft,lock:lock})}).then(function(r){return r.json()}).then(function(j){
    if(j.success){toast(lock?'Answer locked! 🔒':'Draft saved','success');renderWorkshop()}
    else toast(j.error||'Save failed','error');
  }).catch(function(){toast('Connection error','error')});
}

function scoreWorkshopAnswer(qid){
  var draft=document.getElementById('wsDraft').value.trim();
  if(!draft||draft.length<20){toast('Write at least a few sentences','error');return}
  var q=wsData.questions.find(function(q){return q.id===qid});
  var slot=document.getElementById('wsScoreResult');
  slot.innerHTML='<div class="loading"><div class="spinner"></div><div style="font-size:12px;color:var(--text2)">Scoring your answer...</div></div>';
  fetch('/api/workshop-score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.q,answer:draft})}).then(function(r){return r.json()}).then(function(j){
    if(!j.success){slot.innerHTML='<div style="color:var(--red);font-size:13px;margin-top:8px">Scoring failed — check API key</div>';return}
    var s=j.scores;var overall=s.overall||0;
    var color=overall>=8?'var(--green)':overall>=5?'var(--amber)':'var(--red)';
    slot.innerHTML='<div class="ws-feedback">'+
      '<div style="font-size:20px;font-weight:700;color:'+color+';margin-bottom:8px">Score: '+overall+'/10</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'+
      '<div style="font-size:12px"><strong>Relevance:</strong> '+s.relevance.score+'/10 — '+escHtml(s.relevance.feedback)+'</div>'+
      '<div style="font-size:12px"><strong>Structure:</strong> '+s.structure.score+'/10 — '+escHtml(s.structure.feedback)+'</div>'+
      '<div style="font-size:12px"><strong>Specificity:</strong> '+s.specificity.score+'/10 — '+escHtml(s.specificity.feedback)+'</div>'+
      '<div style="font-size:12px"><strong>Marketing:</strong> '+s.marketing.score+'/10 — '+escHtml(s.marketing.feedback)+'</div></div>'+
      (s.weak?'<div style="background:var(--red-s);padding:8px 12px;border-radius:6px;font-size:12px;margin:6px 0"><strong style="color:var(--red)">❌ WEAK:</strong> '+escHtml(s.weak)+'</div>':'')+
      (s.better?'<div style="background:var(--green-s);padding:8px 12px;border-radius:6px;font-size:12px;margin:6px 0"><strong style="color:var(--green)">✅ BETTER:</strong> '+escHtml(s.better)+'</div>':'')+
      (s.memorize?'<div style="background:var(--accent-s);padding:8px 12px;border-radius:6px;font-size:12px;margin:6px 0;font-weight:600;color:var(--accent)">💬 MEMORIZE: '+escHtml(s.memorize)+'</div>':'')+
      (s.improved_answer?'<div style="margin-top:10px"><div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px">✨ IMPROVED VERSION (tap to copy to editor):</div>'+
      '<div style="background:var(--surface);padding:10px 14px;border-radius:var(--rs);font-size:13px;line-height:1.6;cursor:pointer;border:1px solid var(--accent)" onclick="document.getElementById(\'wsDraft\').value=this.textContent;toast(\'Copied to editor\',\'success\')">'+escHtml(s.improved_answer)+'</div></div>':'')+
      '</div>';
    // Auto-save with score
    fetch('/api/workshop-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionId:qid,draft:draft,score:overall,feedback:(s.weak||'')+' '+(s.better||'')})}).catch(function(){});
  }).catch(function(){slot.innerHTML='<div style="color:var(--red);font-size:13px;margin-top:8px">Connection error</div>'});
}

// ═══ APTITUDE & REASONING ═══
var aptCat='quantitative',aptDiff='medium',aptQuestions=null,aptAnswered={},aptScore=0,aptMode='menu',aptStats=null;
function renderAptitude(){
  var pg=document.getElementById('page-aptitude');
  if(aptMode==='quiz'){renderAptQuiz(pg);return}
  // Load stats
  var statsPromise=currentUser?safeFetch('/api/aptitude-stats').catch(function(){return{stats:{}}}):{then:function(cb){cb({stats:{}})}};
  Promise.resolve(statsPromise).then(function(j){
    aptStats=j.stats||{};
    var html='<div class="hero"><h1>Aptitude & Reasoning</h1><p>Quantitative, logical, data interpretation, and sales basics — the questions that screen you before the interview.</p></div>';
    // Stats
    if(Object.keys(aptStats).length>0){
      html+='<div class="apt-stats">';
      var labels={quantitative:'🔢 Quant',logical:'🧠 Logical',data_interpretation:'📊 Data',sales_basics:'💼 Sales',oral_rapid_fire:'⚡ Oral',puzzles_brain_teasers:'🧩 Puzzles'};
      for(var k in labels){
        var st=aptStats[k]||{correct:0,attempted:0,accuracy:0,sessions:0};
        html+='<div class="apt-stat-card"><div class="apt-stat-val">'+(st.accuracy||0)+'%</div><div class="apt-stat-lbl">'+labels[k]+'</div><div style="font-size:10px;color:var(--text2)">'+st.correct+'/'+st.attempted+'</div></div>';
      }
      html+='</div>';
    }
    html+='<div style="font-size:13px;font-weight:600;margin:16px 0 8px">Choose category:</div>'+
      '<div class="apt-cat-grid" style="grid-template-columns:1fr 1fr 1fr">'+
      '<div class="apt-cat '+(aptCat==='quantitative'?'active':'')+'" onclick="aptCat=\'quantitative\';renderAptitude()"><div class="apt-cat-ico">🔢</div><div class="apt-cat-name">Quantitative</div><div class="apt-cat-desc">Percentages, profit-loss, ratios, time-speed</div></div>'+
      '<div class="apt-cat '+(aptCat==='logical'?'active':'')+'" onclick="aptCat=\'logical\';renderAptitude()"><div class="apt-cat-ico">🧠</div><div class="apt-cat-name">Logical Reasoning</div><div class="apt-cat-desc">Series, syllogisms, coding, blood relations</div></div>'+
      '<div class="apt-cat '+(aptCat==='data_interpretation'?'active':'')+'" onclick="aptCat=\'data_interpretation\';renderAptitude()"><div class="apt-cat-ico">📊</div><div class="apt-cat-name">Data Interpretation</div><div class="apt-cat-desc">Tables, charts, growth rates, percentages</div></div>'+
      '<div class="apt-cat '+(aptCat==='sales_basics'?'active':'')+'" onclick="aptCat=\'sales_basics\';renderAptitude()"><div class="apt-cat-ico">💼</div><div class="apt-cat-name">Sales & Marketing</div><div class="apt-cat-desc">AIDA, CLV, objection handling, pricing</div></div>'+
      '<div class="apt-cat '+(aptCat==='oral_rapid_fire'?'active':'')+'" onclick="aptCat=\'oral_rapid_fire\';renderAptitude()" style="border-color:var(--red)"><div class="apt-cat-ico">⚡</div><div class="apt-cat-name">Oral Rapid-Fire</div><div class="apt-cat-desc">Mental math interviewers ask mid-conversation</div></div>'+
      '<div class="apt-cat '+(aptCat==='puzzles_brain_teasers'?'active':'')+'" onclick="aptCat=\'puzzles_brain_teasers\';renderAptitude()"><div class="apt-cat-ico">🧩</div><div class="apt-cat-name">Puzzles & Brain Teasers</div><div class="apt-cat-desc">25 horses, 8 balls, Monty Hall — the classics</div></div></div>'+
      '<div style="font-size:13px;font-weight:600;margin:16px 0 8px">Difficulty:</div>'+
      '<div class="ca-diff-row">'+
      '<button class="ca-diff-btn easy '+(aptDiff==='easy'?'active':'')+'" onclick="aptDiff=\'easy\';document.querySelectorAll(\'.ca-diff-btn\').forEach(function(b){b.classList.remove(\'active\')});this.classList.add(\'active\')">Easy</button>'+
      '<button class="ca-diff-btn medium '+(aptDiff==='medium'?'active':'')+'" onclick="aptDiff=\'medium\';document.querySelectorAll(\'.ca-diff-btn\').forEach(function(b){b.classList.remove(\'active\')});this.classList.add(\'active\')">Medium</button>'+
      '<button class="ca-diff-btn hard '+(aptDiff==='hard'?'active':'')+'" onclick="aptDiff=\'hard\';document.querySelectorAll(\'.ca-diff-btn\').forEach(function(b){b.classList.remove(\'active\')});this.classList.add(\'active\')">Hard</button></div>'+
      '<div style="display:flex;gap:8px;margin-top:16px">'+
      '<button class="sp-btn" onclick="startAptQuiz(\'bank\')">📝 Practice from Bank</button>'+
      '<button class="sp-btn" style="background:var(--blue)" onclick="startAptQuiz(\'ai\')">🤖 AI-Generated Questions</button></div>';
    pg.innerHTML=html;
  });
}

function startAptQuiz(source){
  aptAnswered={};aptScore=0;aptMode='quiz';
  var pg=document.getElementById('page-aptitude');
  if(source==='bank'){
    aptQuestions=[];
    var bank=null;
    safeFetch('/api/aptitude-bank').then(function(j){
      bank=j.bank[aptCat]||[];
      var filtered=bank.filter(function(q){return aptDiff==='all'||q.diff===aptDiff});
      if(filtered.length<3)filtered=bank;
      // Shuffle and take 5-10
      for(var i=filtered.length-1;i>0;i--){var j2=Math.floor(Math.random()*(i+1));var t=filtered[i];filtered[i]=filtered[j2];filtered[j2]=t}
      aptQuestions=filtered.slice(0,Math.min(10,filtered.length));
      renderAptQuiz(pg);
    }).catch(function(){toast('Could not load questions','error');aptMode='menu';renderAptitude()});
  } else {
    pg.innerHTML='<div class="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--text2)">Generating '+aptCat+' questions...</div></div>';
    fetch('/api/aptitude-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:aptCat,difficulty:aptDiff})}).then(function(r){return r.json()}).then(function(j){
      if(j.success){aptQuestions=j.questions;renderAptQuiz(pg)}
      else{toast('Generation failed — check API key','error');aptMode='menu';renderAptitude()}
    }).catch(function(){toast('Connection error','error');aptMode='menu';renderAptitude()});
  }
}

function renderAptQuiz(pg){
  var done=Object.keys(aptAnswered).length;
  var total=aptQuestions.length;
  if(done===total&&total>0){
    // Show results
    var pct=Math.round(aptScore/total*100);
    var color=pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
    pg.innerHTML='<div class="apt-result"><div class="apt-result-score" style="color:'+color+'">'+aptScore+'/'+total+'</div><div class="apt-result-label">'+pct+'% accuracy · '+aptCat.replace('_',' ')+'</div>'+
      '<button class="sp-btn" onclick="aptMode=\'menu\';renderAptitude()" style="margin-top:16px">← Back to Menu</button>'+
      '<button class="sp-btn" style="background:var(--blue);margin-top:8px" onclick="startAptQuiz(\'bank\')">Try Again</button></div>';
    if(currentUser)fetch('/api/aptitude-score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:aptCat,difficulty:aptDiff,score:aptScore,total:total})}).catch(function(){});
    return;
  }
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:14px;font-weight:600">'+aptCat.replace('_',' ').replace(/\b\w/g,function(c){return c.toUpperCase()})+' — '+aptDiff+'</div>'+
    '<button class="mode-btn" onclick="aptMode=\'menu\';renderAptitude()">← Back</button></div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Score: '+aptScore+'/'+done+' answered · '+total+' total</div>';
  aptQuestions.forEach(function(q,qi){
    var answered=aptAnswered[qi]!==undefined;
    html+='<div class="apt-q"><div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:6px">Q'+(qi+1)+'</div>'+
      '<div class="apt-q-text">'+escHtml(q.q)+'</div>';
    q.opts.forEach(function(o,oi){
      var cls='apt-opt';
      if(answered){
        cls+=' disabled';
        if(oi===q.ans)cls+=' correct';
        if(oi===aptAnswered[qi]&&oi!==q.ans)cls+=' wrong';
      }
      html+='<button class="'+cls+'" onclick="answerApt('+qi+','+oi+','+q.ans+')">'+escHtml(o)+'</button>';
    });
    html+='<div class="apt-exp'+(answered?' show':'')+'">'+escHtml(q.exp||'')+'</div></div>';
  });
  pg.innerHTML=html;
}

function answerApt(qi,oi,correct){
  if(aptAnswered[qi]!==undefined)return;
  aptAnswered[qi]=oi;
  if(oi===correct)aptScore++;
  renderAptQuiz(document.getElementById('page-aptitude'));
}

var cmFilter='all';
function renderCompanyMap(){
  var pg=document.getElementById('page-companymap');
  pg.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  safeFetch('/api/company-map').then(function(j){
    var companies=j.companies;
    var sectors=[...new Set(companies.map(function(c){return c.sector}))];
    var filterBtns='<button class="mode-btn '+(cmFilter==='all'?'active':'')+'" onclick="cmFilter=\'all\';renderCompanyMap()">All ('+companies.length+')</button>';
    sectors.forEach(function(s){
      var count=companies.filter(function(c){return c.sector===s}).length;
      filterBtns+='<button class="mode-btn '+(cmFilter===s?'active':'')+'" onclick="cmFilter=\''+s+'\';renderCompanyMap()">'+s+' ('+count+')</button>';
    });
    var filtered=cmFilter==='all'?companies:companies.filter(function(c){return c.sector===cmFilter});

    var html='<div class="hero"><h1>Company Process Map</h1><p>Know exactly what each company tests — round by round — so you walk in prepared.</p></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">'+filterBtns+'</div>';

    filtered.forEach(function(c,i){
      html+='<div class="cm-card" id="cm-'+i+'" onclick="document.getElementById(\'cm-'+i+'\').classList.toggle(\'expanded\')">'+
        '<div class="cm-card-top"><div class="cm-card-name">'+escHtml(c.company)+'</div><span class="cm-card-sector">'+escHtml(c.sector)+'</span></div>'+
        '<div style="font-size:12px;color:var(--text2);margin-top:4px">'+c.rounds.length+' rounds</div>'+
        '<div class="cm-rounds">'+
        c.rounds.map(function(r,ri){return'<div class="cm-round"><span class="cm-round-num">'+(ri+1)+'</span><span>'+escHtml(r)+'</span></div>'}).join('')+
        '</div>'+
        '<div class="cm-tips">💡 '+escHtml(c.tips)+'</div>'+
        '<div class="cm-prep">'+
        c.prepModes.map(function(m){return'<button class="mode-btn" onclick="event.stopPropagation();showPage(\'coach\');startCoach(\''+m+'\')">Practice '+m+'</button>'}).join('')+
        '<button class="mode-btn" onclick="event.stopPropagation();showPage(\'coach\');startCompanyCoach(\''+escHtml(c.company)+'\')">🏢 '+escHtml(c.company)+' Mock</button>'+
        '</div></div>';
    });
    pg.innerHTML=html;
  }).catch(function(){pg.innerHTML='<div class="no-login">Could not load. Retry.</div>'});
}
